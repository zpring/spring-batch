name: Build Release
runs:
  using: composite
  steps:
    - name: Enforce release rules
      shell: bash
      run: ./mvnw org.apache.maven.plugins:maven-enforcer-plugin:enforce -Drules=requireReleaseDeps
    - name: Build Release
      shell: bash
      run:  ./mvnw --batch-mode --settings release-train-settings.xml clean deploy --activate-profiles releaseTrain -DaltDeploymentRepository="release-train::file://$(pwd)/deployment-repository" -DskipTests
